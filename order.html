<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="order.css">
</head>
<body>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="badge"><span class="badge-dot"></span> New Order</div>
      <h1>Your <em>Order</em> Details</h1>
      <p>Fill in your information to complete your purchase</p>
    </div>
    <div class="steam-bar"><div class="steam-fill"></div></div>

    <!-- Form Body -->
    <div class="card-body">
      <form action="payment.html">

        <!-- Customer Info -->
        <p class="section-label">Customer Information</p>
        <div class="form-grid">

          <div class="form-row">
            <div class="form-group">
              <label for="name">Full Name <span class="req">*</span></label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input type="text" id="name" placeholder="Enter your name" required />
              </div>
            </div>

            <div class="form-group">
              <label for="contact">Contact Number <span class="req">*</span></label>
              <div class="input-wrap">
                <span class="input-icon">📞</span>
                <input type="tel" id="contact" placeholder="+91 00000 00000" required />
              </div>
            </div>
          </div>

          <div class="form-group span-full">
            <label for="email">Email Address <span class="req">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input type="email" id="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-group span-full">
            <label for="address">Delivery Address <span class="req">*</span></label>
            <div class="input-wrap">
              <span class="input-icon textarea-icon">🏠</span>
              <textarea id="address" placeholder="House no., Street, City, PIN code" required></textarea>
            </div>
          </div>

          <div class="form-group span-full">
            <label for="state">State <span class="req">*</span></label>
            <div class="input-wrap select-wrap">
              <span class="input-icon">📍</span>
              <select id="state" required>
                <option value="" disabled selected>Select your state</option>
                <optgroup label="States">
                  <option>Bihar</option>
                  <option>Gujrat</option>
                  <option>Haryana</option>
                  <option>Jharkhand</option>
                  <option>Madhya Pradesh</option>
                  <option>Maharashtra</option>
                  <option>Odisha</option>
                  <option>Uttar Pradesh</option>
                  <option>West Bengal</option>
                </optgroup>
              </select>
            </div>
          </div>

        </div>

        <!-- Payment -->
        <div class="divider"></div>
        <p class="section-label">Payment Method</p>

        <div class="form-group">
          <label for="payment">Payment Mode <span class="req">*</span></label>
          <div class="input-wrap select-wrap">
            <span class="input-icon">💳</span>
            <select id="payment" required>
              <option value="" disabled selected>Select payment method</option>
              <option value="cod">Cash on Delivery</option>
              <option value="upi">PhonePe / UPI</option>
              <option value="card">Debit / Credit Card</option>
              <option value="netbanking">Pay by Account Number</option>
            </select>
          </div>
        </div>

        <!-- Submit -->
        <div class="btn-wrap">
          <button type="submit" class="btn">
            <span class="btn-inner">
              <span>☕</span>
              Place My Order
            </span>
          </button>
        </div>

        <div class="secure-note">🔒 Your information is safe &amp; encrypted</div>

      </form>
    </div>

  </div>

</body>
</html>
